name: Verify playable edition
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate the initial npm lockfile
        id: generate-lock
        if: hashFiles('package-lock.json') == ''
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Retain the generated lockfile for review
        if: steps.generate-lock.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sitrep-npm-lock
          path: package-lock.json
          if-no-files-found: error
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm audit --audit-level=high
